name: "Experiment: headless first boot"

# A manual experiment outside every release path. It follows the container's
# headless pre-install in the same order: seed the flatlaf-themes request, boot
# headless, wait for the detached chain, then TERM and KILL it. The extension
# registry is read only at JVM init, and the first boot's daemon holds the JD2
# single-instance lock, so a later boot would die on the lock and never consume
# the request.
#
# It answers two questions:
#   1. Fresh install: does a request seeded beforehand make the headless chain
#      install libs/laf/flatlaf.jar together with the core?
#   2. Heal (an existing install missing the extension): once the chain is
#      killed, does a new headless JVM consume a seeded request and install it?
# The answers are in the artifact and the job log; nothing is published.

on:
  workflow_dispatch:

jobs:
  headless-first-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Java 21 (full JRE, like the image)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre

      - name: Prepare JD dir, theme config and the flatlaf-themes request (as autostart does)
        run: |
          mkdir -p "$RUNNER_TEMP/jd/cfg" "$RUNNER_TEMP/jd/update/versioninfo/JD"
          cat > "$RUNNER_TEMP/jd/cfg/org.jdownloader.settings.GraphicalUserInterfaceSettings.json" <<'EOF'
          {"lookandfeeltheme":"FLATLAF_DARK"}
          EOF
          # JD's LookAndFeelType maps every FlatLaf theme to the updater extension id
          # "flatlaf-themes", and the request list is a plain JSON array, the same
          # path other JD Docker images seed.
          echo '["flatlaf-themes"]' > "$RUNNER_TEMP/jd/update/versioninfo/JD/extensions.requestedinstalls.json"
          echo "pre-seeded:"
          cat "$RUNNER_TEMP/jd/update/versioninfo/JD/extensions.requestedinstalls.json"

      - name: Download JDownloader.jar
        run: |
          wget -q -O "$RUNNER_TEMP/jd/JDownloader.jar" "https://installer.jdownloader.org/JDownloader.jar"
          python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).namelist()" "$RUNNER_TEMP/jd/JDownloader.jar"

      - name: "Boot 1: headless first run with pre-seeded request (container fresh-install semantics)"
        run: |
          cd "$RUNNER_TEMP/jd"
          set +e
          timeout --signal=TERM --kill-after=30 600 \
            java -Djava.awt.headless=true -jar JDownloader.jar < /dev/null > boot1.log 2>&1
          echo "boot1_exit=$?" | tee boot1.exit
          # The bootstrap spawns a detached chain (SecondLevelLauncher, rescue
          # updater, core install) that ends in a running headless daemon, which
          # is stopped the same way the container does it.
          waited=0
          while pgrep -f 'java.*jar' > /dev/null 2>&1 && [ "$waited" -lt 900 ]; do
            sleep 15
            waited=$((waited + 15))
            echo "...detached updater chain still running (${waited}s)"
          done
          echo "chain_done_after=${waited}s"
          pkill -TERM -f 'java.*jar' 2>/dev/null || true
          w=0
          while pgrep -f 'java.*jar' > /dev/null 2>&1 && [ "$w" -lt 12 ]; do
            sleep 5; w=$((w + 1))
          done
          pkill -KILL -f 'java.*jar' 2>/dev/null || true
          set -e
          echo "── last 60 log lines ──"
          tail -60 boot1.log || true

      - name: "Verdict 1 (fresh install): flatlaf.jar after the pre-seeded headless run?"
        run: |
          cd "$RUNNER_TEMP/jd"
          echo "== did the updater see the request? =="
          grep -a "Requested Extension Installations" boot1.log | head -5 || echo "(no ExtensionManager init line in boot1.log)"
          echo "== verdict 1: libs/laf =="
          ls -la libs/laf 2>/dev/null || echo "NO libs/laf"
          echo "== extension registry after boot 1 =="
          for f in update/versioninfo/JD/extensions*; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; echo; }
          done
          echo "== core sanity =="
          ls Core.jar build.json 2>/dev/null || echo "core incomplete"

      # Heal: an existing install that is missing the extension. The request is
      # seeded again if it was consumed, and a new JVM (boot 1's chain is dead, so
      # the lock is free) has to read it at init and install the extension.
      - name: "Boot 2 (heal path): fresh JVM with seeded request on an existing install"
        run: |
          cd "$RUNNER_TEMP/jd"
          python3 - <<'PYEOF'
          import json, os
          path = "update/versioninfo/JD/extensions.requestedinstalls.json"
          ids = []
          if os.path.exists(path):
              try:
                  ids = json.load(open(path))
                  if not isinstance(ids, list):
                      ids = []
              except Exception:
                  ids = []
          if "flatlaf-themes" not in ids:
              ids.append("flatlaf-themes")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          json.dump(ids, open(path, "w"))
          print("seed state ->", path, json.dumps(ids))
          PYEOF
          set +e
          timeout --signal=TERM --kill-after=30 480 \
            java -Djava.awt.headless=true -jar JDownloader.jar < /dev/null > boot2.log 2>&1
          echo "boot2_exit=$?" | tee boot2.exit
          waited=0
          while pgrep -f 'java.*jar' > /dev/null 2>&1 && [ "$waited" -lt 480 ]; do
            sleep 15
            waited=$((waited + 15))
            echo "...chain still running after boot 2 (${waited}s)"
          done
          pkill -TERM -f 'java.*jar' 2>/dev/null || true
          sleep 10
          pkill -KILL -f 'java.*jar' 2>/dev/null || true
          set -e
          echo "== did the updater see the request? =="
          grep -a "Requested Extension Installations" boot2.log | head -5 || echo "(no ExtensionManager init line in boot2.log)"
          echo "== verdict 2 (heal): libs/laf =="
          ls -la libs/laf 2>/dev/null || echo "still NO libs/laf"
          echo "== extension registry after boot 2 =="
          for f in update/versioninfo/JD/extensions*; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; echo; }
          done
          echo "── last 40 log lines ──"
          tail -40 boot2.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: headless-experiment
          path: |
            ${{ runner.temp }}/jd/boot1.log
            ${{ runner.temp }}/jd/boot2.log
            ${{ runner.temp }}/jd/boot1.exit
            ${{ runner.temp }}/jd/boot2.exit
          if-no-files-found: warn
