name: Experiment — headless first boot

# -----------------------------------------------------------------------------
# v3 Architecture-A experiment (manual only, NOT part of any release path).
# Question: can JD's FIRST boot run with -Djava.awt.headless=true so the
# updater installs silently with NO GUI (=> no forced dialog cascade), before
# the real GUI start? Open points this run answers empirically:
#   1. Does the headless updater complete the core install at all?
#   2. Does it install the FlatLaf themes extension (libs/laf/flatlaf.jar)?
#      (Its install trigger normally hangs off LookAndFeelController.setUIManager,
#      which early-returns headless — the pessimistic case is "no jar".)
#   3. Does JD park on an interactive MyJDownloader stdin prompt (container
#      stdin is not a TTY — here stdin is /dev/null, worst case)?
#   4. Does a SECOND headless boot come up clean/settled?
# Read the artifact + job log; nothing is published.
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  headless-first-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Java 21 (full JRE, like the image)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre

      - name: Prepare JD dir + pre-seed theme config (mirrors jdownloader-theme.sh)
        run: |
          mkdir -p "$RUNNER_TEMP/jd/cfg"
          cat > "$RUNNER_TEMP/jd/cfg/org.jdownloader.settings.GraphicalUserInterfaceSettings.json" <<'EOF'
          {"lookandfeeltheme":"FLATLAF_DARK"}
          EOF

      - name: Download JDownloader.jar
        run: |
          wget -q -O "$RUNNER_TEMP/jd/JDownloader.jar" "https://installer.jdownloader.org/JDownloader.jar"
          python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).namelist()" "$RUNNER_TEMP/jd/JDownloader.jar"

      - name: "Boot 1: headless first run (10 min budget, stdin=/dev/null)"
        run: |
          cd "$RUNNER_TEMP/jd"
          set +e
          timeout --signal=TERM --kill-after=30 600 \
            java -Djava.awt.headless=true -jar JDownloader.jar < /dev/null > boot1.log 2>&1
          echo "boot1_exit=$?" | tee boot1.exit
          # Run 1 learned: the bootstrap spawns a DETACHED process chain
          # (SecondLevelLauncher -> rescue updater -> core install) that keeps
          # working after the first JVM exits — wait for the WHOLE chain before
          # observing, exactly like the container's launcher loop does.
          waited=0
          while pgrep -f 'java.*jar' > /dev/null 2>&1 && [ "$waited" -lt 900 ]; do
            sleep 15
            waited=$((waited + 15))
            echo "...detached updater chain still running (${waited}s)"
          done
          echo "chain_done_after=${waited}s" | tee chain.wait
          set -e
          echo "── last 120 log lines ──"
          tail -120 boot1.log || true

      - name: "Observations after boot 1"
        run: |
          cd "$RUNNER_TEMP/jd"
          echo "== exit code (124 = still running at 10 min = daemonised) =="
          cat boot1.exit
          echo "== core installed? =="
          ls -la . || true
          echo "== libs present? =="
          ls -la libs 2>/dev/null || echo "NO libs dir"
          echo "== THE key question: flatlaf.jar? =="
          ls -la libs/laf 2>/dev/null || echo "NO libs/laf — themes extension NOT installed headless"
          echo "== cfg after first boot =="
          ls -la cfg 2>/dev/null || true
          echo "== build.json (revision canary source)? =="
          cat build.json 2>/dev/null || echo "NO build.json"
          echo "== stdin/MyJD prompt indicators in the log =="
          grep -inE "myjdownloader|e-?mail|password|console|stdin|input" boot1.log | head -30 || echo "none found"
          echo "== updater activity =="
          grep -inE "update|install|download" boot1.log | tail -30 || true

      # Box test learned: the headless install completes with NOTHING pending, so the
      # GUI first start shows NO design-install dialog and the FlatLaf themes extension
      # never installs -> JD falls back to light Synthetica. Hypothesis: pre-seeding the
      # extension REQUEST into JD's update registry makes the headless chain install it.
      - name: "Discover extension registry schema + flatlaf extension id"
        run: |
          cd "$RUNNER_TEMP/jd"
          echo "== extension storage files =="
          ls -la update/versioninfo/JD/ 2>/dev/null || echo "no versioninfo dir"
          for f in update/versioninfo/JD/extensions*; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; echo; }
          done
          echo "== flatlaf tokens in filelist.txt =="
          grep -aio "[a-z0-9_./-]*flatlaf[a-z0-9_./-]*" update/versioninfo/JD/filelist.txt 2>/dev/null | sort -u | head -30 || echo "no filelist match"

      - name: "Seed the flatlaf themes extension request"
        run: |
          cd "$RUNNER_TEMP/jd"
          python3 - <<'PYEOF'
          import json, os, glob, re
          d = "update/versioninfo/JD"
          os.makedirs(d, exist_ok=True)
          extid = "flatlafthemes"
          try:
              fl = open(os.path.join(d, "filelist.txt"), encoding="utf-8", errors="replace").read()
              cands = sorted(set(x.lower() for x in re.findall(r"[A-Za-z0-9_.-]*flatlaf[A-Za-z0-9_.-]*", fl)))
              print("filelist flatlaf tokens:", cands[:20])
              for c in cands:
                  if "theme" in c and "." not in c:
                      extid = c
                      break
          except Exception as e:
              print("filelist read failed:", e)
          print("using extension id:", extid)
          existing = glob.glob(os.path.join(d, "extensions*"))
          path = existing[0] if existing else os.path.join(d, "extensions.json")
          data = {}
          if os.path.exists(path):
              try:
                  data = json.load(open(path))
              except Exception:
                  pass
          print("existing storage:", json.dumps(data))
          seeded = False
          for k in list(data.keys()):
              kl = k.lower()
              if "request" in kl and ("install" in kl or "add" in kl) and isinstance(data[k], list):
                  if extid not in data[k]:
                      data[k].append(extid)
                  seeded = True
          if not seeded:
              # AppWork JsonKeyValueStorage convention: getRequestedInstalls -> "requestedinstalls"
              data.setdefault("requestedinstalls", [])
              if extid not in data["requestedinstalls"]:
                  data["requestedinstalls"].append(extid)
          json.dump(data, open(path, "w"))
          print("seeded ->", path, json.dumps(data))
          PYEOF

      - name: "Boot 2: headless re-run with seeded extension request (10 min budget)"
        run: |
          cd "$RUNNER_TEMP/jd"
          set +e
          timeout --signal=TERM --kill-after=30 600 \
            java -Djava.awt.headless=true -jar JDownloader.jar < /dev/null > boot2.log 2>&1
          echo "boot2_exit=$?" | tee boot2.exit
          waited=0
          while pgrep -f 'java.*jar' > /dev/null 2>&1 && [ "$waited" -lt 600 ]; do
            sleep 15
            waited=$((waited + 15))
            echo "...chain still running after boot 2 (${waited}s)"
          done
          set -e
          echo "== did the updater see the request? =="
          grep -a "Requested Extension Installations" boot2.log | head -5 || true
          echo "== THE verdict: flatlaf.jar after seeded headless run =="
          ls -la libs/laf 2>/dev/null || echo "still NO libs/laf"
          echo "== extension registry after boot 2 =="
          for f in update/versioninfo/JD/extensions*; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; echo; }
          done
          echo "── last 40 log lines ──"
          tail -40 boot2.log || true

      - name: Upload logs + tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-experiment
          path: |
            ${{ runner.temp }}/jd/boot1.log
            ${{ runner.temp }}/jd/boot2.log
            ${{ runner.temp }}/jd/boot1.exit
            ${{ runner.temp }}/jd/boot2.exit
          if-no-files-found: warn
