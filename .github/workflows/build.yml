name: Build & Push

# -----------------------------------------------------------------------------
# Builds the JDownloader image and pushes it to:
#   * GitHub Container Registry  (ghcr.io/junkerderprovinz/jdownloader)
#   * Docker Hub                 (docker.io/<DOCKERHUB_USERNAME>/jdownloader)
#     — active only once the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN
#       secret are set together; until then the build stays GHCR-only.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [ main, 'feat/v3' ]   # feat/v3 -> :v3-preview (box-testing the v3 redesign)
    tags: [ 'v*.*.*' ]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: jdownloader

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror — active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together; otherwise skipped (GHCR-only).
      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=schedule,pattern=weekly
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v3-preview,enable=${{ github.ref == 'refs/heads/feat/v3' }}
            type=sha,format=short

      # Smoke-test gate (amd64): build the image, boot it, and require the KasmVNC
      # WebUI to respond before anything is pushed. A green Docker build only proves
      # the image *builds* — this proves the container actually *starts* and serves
      # the WebUI (catches an s6 / KasmVNC / JDownloader boot crash before :latest).
      # amd64-only on purpose: the heavy KasmVNC + Java GUI is too slow to boot
      # reliably under arm64 QEMU emulation for a CI gate.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: jdownloader:smoke-amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha

      - name: Smoke test — amd64 must boot and serve the WebUI
        run: |
          set -euo pipefail
          name=jd-smoke
          docker run -d --name "$name" --platform linux/amd64 -p 3000:3000 -p 3001:3001 jdownloader:smoke-amd64
          up() {
            # KasmVNC serves HTTPS on 3001 (self-signed) and HTTP on 3000; any HTTP
            # status (even 401) means the WebUI server is up. 000 = not listening.
            local c
            c=$(curl -k -o /dev/null -s -w '%{http_code}' --max-time 5 https://localhost:3001/ || true)
            { [ -n "$c" ] && [ "$c" != "000" ]; } && return 0
            c=$(curl -o /dev/null -s -w '%{http_code}' --max-time 5 http://localhost:3000/ || true)
            { [ -n "$c" ] && [ "$c" != "000" ]; } && return 0
            return 1
          }
          webui_up=""
          for i in $(seq 1 150); do
            if up; then
              echo "✅ WebUI responded after ${i}s"
              webui_up=1
              break
            fi
            if [ -z "$(docker ps -q --filter "name=$name")" ]; then
              echo "❌ container exited early — logs:"; docker logs "$name" || true
              docker rm -f "$name" >/dev/null; exit 1
            fi
            sleep 1
          done
          if [ -z "$webui_up" ]; then
            echo "❌ WebUI did not respond within 150s — logs:"
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null
            exit 1
          fi
          # The WebUI being up only proves KasmVNC — also require JDownloader itself
          # to launch: autostart prints this exact line right at the JVM start.
          jd_line='[jdownloader-autostart] launching JDownloader JVM (the GUI starts here)...'
          for i in $(seq 1 120); do
            # Capture first, then substring-match in bash: `docker logs | grep -q`
            # under pipefail dies of SIGPIPE (status 141) once the log grows past
            # grep's early exit — the line was "not found" although present
            # (flaky gate). No pipeline = no SIGPIPE.
            logs=$(docker logs "$name" 2>&1 || true)
            if [[ "$logs" == *"$jd_line"* ]]; then
              echo "✅ JDownloader JVM launch confirmed after ${i}s"
              docker rm -f "$name" >/dev/null
              exit 0
            fi
            if [ -z "$(docker ps -q --filter "name=$name")" ]; then
              echo "❌ container exited early — logs:"; docker logs "$name" || true
              docker rm -f "$name" >/dev/null; exit 1
            fi
            sleep 1
          done
          echo "❌ JDownloader JVM launch line not seen within 120s — logs:"
          docker logs "$name" || true
          docker rm -f "$name" >/dev/null
          exit 1

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirror the GitHub README to the Docker Hub repo's full description (same
      # text as on GitHub; relative image/link paths completed to absolute so they
      # render on Docker Hub). Editing the description needs a credential the push
      # token (DOCKERHUB_TOKEN) lacks — it returns 403 — so this uses a separate
      # DOCKERHUB_PASSWORD secret (Docker Hub account password, or a PAT scoped to
      # edit repos). Skipped until that secret is set, so a missing credential
      # never fails the build.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_PASSWORD not set — skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          short-description: "JDownloader 2 in your browser for Unraid (KasmVNC), monochrome Carbon dark theme."
          enable-url-completion: true

      - name: Image digest
        run: echo "Image digest = ${{ steps.meta.outputs.digest }}"
