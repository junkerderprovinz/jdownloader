name: Build & Push

# Builds the JDownloader image and pushes it to
#   * GitHub Container Registry  (ghcr.io/junkerderprovinz/jdownloader)
#   * Docker Hub                 (docker.io/<DOCKERHUB_USERNAME>/jdownloader),
#     once the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret are
#     both set; until then the build stays GHCR-only.

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: jdownloader

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # upload the Trivy SARIF to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Docker Hub mirror runs only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are both set.
      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Is the tag being built the newest release in this repo?
      #
      # `latest` moves only for a tag build (see the metadata block below), and
      # only for the highest version. Both halves are needed and they guard
      # different accidents: gating on tags stops an unreleased merge from
      # reaching everybody who pulls `latest`, and gating on "newest" stops a
      # re-cut of an older version from dragging `latest` backwards.
      #
      # checkout gives no tags by default, so they are fetched here rather than
      # assumed. `sort -V` orders versions, not strings, so v4.10.0 beats v4.9.0.
      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
            echo "-> this build moves :latest"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "-> this build leaves :latest where it is"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # `latest` is the newest released version and nothing else: a tag
          # build sets it, and only when that tag is the newest release (see
          # the step above). `edge` follows the tip of main, built and
          # smoke-tested like everything else, for those who ask for it.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=schedule,pattern=weekly
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true' }}
            type=sha,format=short
          # org.opencontainers.image.version carries the git ref (v4.7.0) like the
          # other own-image repos. Without this override the action derives it from
          # the first tag, which `type=semver,pattern={{version}}` strips of its `v`.
          # Outside tag builds the expression is empty and the action's value stands.
          labels: ${{ github.ref_type == 'tag' && format('org.opencontainers.image.version={0}', github.ref_name) || '' }}

      # Smoke-test gate: build the amd64 image, boot it and require the Selkies
      # WebUI to respond before anything is pushed, which catches an s6, Selkies
      # or JDownloader boot crash that a green build would not. amd64 only,
      # because the Selkies and Java GUI boot too slowly under arm64 QEMU for a
      # reliable gate.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: jdownloader:smoke-amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          # agent-builder is the only stage that compiles our own source and takes
          # about 3 s, so it always runs fresh. From the cache, a tag-only push
          # could restore an older agent layer. Both builds do this so the smoke
          # test and the pushed image compile the same agent.
          no-cache-filters: agent-builder

      - name: Smoke test (amd64 must boot and serve the WebUI)
        run: |
          set -euo pipefail
          name=jd-smoke
          docker run -d --name "$name" --platform linux/amd64 -p 3000:3000 -p 3001:3001 jdownloader:smoke-amd64
          up() {
            # Selkies serves HTTPS on 3001 (self-signed) and HTTP on 3000. Any HTTP
            # status, even 401, means the WebUI server is up; 000 means nothing listens.
            local c
            c=$(curl -k -o /dev/null -s -w '%{http_code}' --max-time 5 https://localhost:3001/ || true)
            { [ -n "$c" ] && [ "$c" != "000" ]; } && return 0
            c=$(curl -o /dev/null -s -w '%{http_code}' --max-time 5 http://localhost:3000/ || true)
            { [ -n "$c" ] && [ "$c" != "000" ]; } && return 0
            return 1
          }
          webui_up=""
          for i in $(seq 1 150); do
            if up; then
              echo "✅ WebUI responded after ${i}s"
              webui_up=1
              break
            fi
            if [ -z "$(docker ps -q --filter "name=$name")" ]; then
              echo "❌ container exited early, logs:"; docker logs "$name" || true
              docker rm -f "$name" >/dev/null; exit 1
            fi
            sleep 1
          done
          if [ -z "$webui_up" ]; then
            echo "❌ WebUI did not respond within 150s, logs:"
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null
            exit 1
          fi
          # The WebUI only proves Selkies, so JDownloader has to launch and stay up
          # too. Autostart prints this line right before the JVM starts, so the
          # line alone proves nothing: a bad -javaagent (a class-version mismatch,
          # say) aborts the JVM right after and autostart relaunches it in a loop.
          # The check fails on the crash signatures and on a relaunch loop, and
          # passes once the JVM has stayed up.
          jd_line='[jdownloader-autostart] launching JDownloader JVM (the GUI starts here)...'
          launched_at=0
          for i in $(seq 1 150); do
            # Captured first and matched in bash: `docker logs | grep -q` under
            # pipefail dies of SIGPIPE (141) once the log outgrows grep's early
            # exit, and the line then reads as missing although it is there.
            logs=$(docker logs "$name" 2>&1 || true)
            if [[ "$logs" == *"UnsupportedClassVersionError"* || "$logs" == *"processing of -javaagent failed"* || "$logs" == *"FATAL ERROR in native method"* || "$logs" == *"agent load/premain call failed"* ]]; then
              echo "❌ JDownloader JVM aborted at startup (agent/JVM crash), logs:"; echo "$logs" | tail -n 60
              docker rm -f "$name" >/dev/null; exit 1
            fi
            launches=$(grep -cF "$jd_line" <<< "$logs" || true)
            if [ "${launches:-0}" -ge 2 ]; then
              echo "❌ JDownloader JVM is crash-looping (launched ${launches}x), logs:"; echo "$logs" | tail -n 60
              docker rm -f "$name" >/dev/null; exit 1
            fi
            if [ "${launches:-0}" -ge 1 ]; then
              [ "$launched_at" -eq 0 ] && launched_at=$i
              if [ $((i - launched_at)) -ge 15 ]; then
                echo "✅ JDownloader JVM launched and stayed up (${i}s, no crash, no relaunch)"
                docker rm -f "$name" >/dev/null; exit 0
              fi
            fi
            if [ -z "$(docker ps -q --filter "name=$name")" ]; then
              echo "❌ container exited early, logs:"; docker logs "$name" || true
              docker rm -f "$name" >/dev/null; exit 1
            fi
            sleep 1
          done
          echo "❌ JDownloader JVM did not stabilise within 150s, logs:"
          docker logs "$name" || true
          docker rm -f "$name" >/dev/null
          exit 1

      # Report only, so a fresh CVE in the base cannot block a push; the findings
      # land in the Security tab. Unfixed CVEs are skipped because nothing can be
      # done about them until upstream ships a fix.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jdownloader:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # See the smoke build above: force a fresh agent-builder compile so the shipped
          # agent never depends on a cached layer from another build.
          no-cache-filters: agent-builder

      # Mirrors the GitHub README to the Docker Hub Overview with DOCKERHUB_TOKEN,
      # the access token the push uses. A token with read, write and delete scope
      # may edit the description, while the account password gets a 401 because
      # Docker Hub's legacy login endpoint refuses passwords once 2FA is on.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set, skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          short-description: "JDownloader 2 in your browser for Unraid (Selkies), monochrome Carbon dark theme."
          enable-url-completion: true

      - name: Image digest
        run: echo "Image digest = ${{ steps.meta.outputs.digest }}"
