name: Build & Push

# -----------------------------------------------------------------------------
# Builds the JDownloader image and pushes it to:
#   * GitHub Container Registry  (ghcr.io/junkerderprovinz/jdownloader)
#   * Docker Hub                 (docker.io/<DOCKERHUB_USERNAME>/jdownloader)
#     — active only once the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN
#       secret are set together; until then the build stays GHCR-only.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: jdownloader

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # upload the Trivy SARIF to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror — active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together; otherwise skipped (GHCR-only).
      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=schedule,pattern=weekly
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Smoke-test gate (amd64): build the image, boot it, and require the Selkies
      # WebUI to respond before anything is pushed. A green Docker build only proves
      # the image *builds* — this proves the container actually *starts* and serves
      # the WebUI (catches an s6 / Selkies / JDownloader boot crash before :latest).
      # amd64-only on purpose: the heavy Selkies + Java GUI is too slow to boot
      # reliably under arm64 QEMU emulation for a CI gate.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: jdownloader:smoke-amd64
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          # Recompile the agent stage fresh every build (~3s). agent-builder is the only
          # stage that compiles our own source; pinning it off-cache makes the shipped
          # agent deterministic rather than dependent on cross-build cache timing (on a
          # tag-only push, agent-builder could otherwise restore an older cached layer).
          # Kept on BOTH builds so the smoke test and the pushed image compile the same agent.
          no-cache-filters: agent-builder

      - name: Smoke test — amd64 must boot and serve the WebUI
        run: |
          set -euo pipefail
          name=jd-smoke
          docker run -d --name "$name" --platform linux/amd64 -p 3000:3000 -p 3001:3001 jdownloader:smoke-amd64
          up() {
            # Selkies serves HTTPS on 3001 (self-signed) and HTTP on 3000; any HTTP
            # status (even 401) means the WebUI server is up. 000 = not listening.
            local c
            c=$(curl -k -o /dev/null -s -w '%{http_code}' --max-time 5 https://localhost:3001/ || true)
            { [ -n "$c" ] && [ "$c" != "000" ]; } && return 0
            c=$(curl -o /dev/null -s -w '%{http_code}' --max-time 5 http://localhost:3000/ || true)
            { [ -n "$c" ] && [ "$c" != "000" ]; } && return 0
            return 1
          }
          webui_up=""
          for i in $(seq 1 150); do
            if up; then
              echo "✅ WebUI responded after ${i}s"
              webui_up=1
              break
            fi
            if [ -z "$(docker ps -q --filter "name=$name")" ]; then
              echo "❌ container exited early — logs:"; docker logs "$name" || true
              docker rm -f "$name" >/dev/null; exit 1
            fi
            sleep 1
          done
          if [ -z "$webui_up" ]; then
            echo "❌ WebUI did not respond within 150s — logs:"
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null
            exit 1
          fi
          # The WebUI being up only proves Selkies — also require JDownloader itself
          # to launch AND STAY UP. Autostart prints this line right BEFORE the JVM
          # starts, so its presence alone is not proof: a bad -javaagent (e.g. a
          # class-version mismatch) aborts the JVM right after, and autostart then
          # relaunches in a loop. So: fail hard on the crash signatures and on a
          # relaunch loop, and require the JVM to stay up before passing.
          jd_line='[jdownloader-autostart] launching JDownloader JVM (the GUI starts here)...'
          launched_at=0
          for i in $(seq 1 150); do
            # Capture first, then match in bash: `docker logs | grep -q` under
            # pipefail dies of SIGPIPE (141) once the log grows past grep's early
            # exit — the line reads "not found" although present. No pipe from a
            # live stream = no SIGPIPE (grep on the captured string is fine).
            logs=$(docker logs "$name" 2>&1 || true)
            if [[ "$logs" == *"UnsupportedClassVersionError"* || "$logs" == *"processing of -javaagent failed"* || "$logs" == *"FATAL ERROR in native method"* || "$logs" == *"agent load/premain call failed"* ]]; then
              echo "❌ JDownloader JVM aborted at startup (agent/JVM crash) — logs:"; echo "$logs" | tail -n 60
              docker rm -f "$name" >/dev/null; exit 1
            fi
            launches=$(grep -cF "$jd_line" <<< "$logs" || true)
            if [ "${launches:-0}" -ge 2 ]; then
              echo "❌ JDownloader JVM is crash-looping (launched ${launches}x) — logs:"; echo "$logs" | tail -n 60
              docker rm -f "$name" >/dev/null; exit 1
            fi
            if [ "${launches:-0}" -ge 1 ]; then
              [ "$launched_at" -eq 0 ] && launched_at=$i
              if [ $((i - launched_at)) -ge 15 ]; then
                echo "✅ JDownloader JVM launched and stayed up (${i}s, no crash, no relaunch)"
                docker rm -f "$name" >/dev/null; exit 0
              fi
            fi
            if [ -z "$(docker ps -q --filter "name=$name")" ]; then
              echo "❌ container exited early — logs:"; docker logs "$name" || true
              docker rm -f "$name" >/dev/null; exit 1
            fi
            sleep 1
          done
          echo "❌ JDownloader JVM did not stabilise within 150s — logs:"
          docker logs "$name" || true
          docker rm -f "$name" >/dev/null
          exit 1

      # CVE scan of the locally-built smoke image. Report-only: exit-code stays 0
      # so a fresh CVE in the base can never block a push; findings land in the
      # repo's Security tab (SARIF) for triage. Ignores unfixed CVEs (nothing to
      # do until upstream ships a fix) and only surfaces HIGH/CRITICAL.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jdownloader:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"     # MUST stay 0 — report only, never fail the build

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # See the smoke build above: force a fresh agent-builder compile so the shipped
          # agent never depends on a cached layer from another build.
          no-cache-filters: agent-builder

      # Mirror the GitHub README to the Docker Hub repo's full description (same
      # text as on GitHub; relative image/link paths completed to absolute so they
      # render on Docker Hub). Editing the description needs a credential the push
      # token (DOCKERHUB_TOKEN) lacks — it returns 403 — so this uses a separate
      # DOCKERHUB_PASSWORD secret (Docker Hub account password, or a PAT scoped to
      # edit repos). Skipped until that secret is set, so a missing credential
      # never fails the build.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_PASSWORD not set — skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          short-description: "JDownloader 2 in your browser for Unraid (Selkies), monochrome Carbon dark theme."
          enable-url-completion: true

      - name: Image digest
        run: echo "Image digest = ${{ steps.meta.outputs.digest }}"
