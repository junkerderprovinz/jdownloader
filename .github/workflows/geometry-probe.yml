name: Geometry Probe

# Diagnostic-only: boots the current :v3-preview image, waits for the JD GUI,
# collects the agent's GEO log lines and a PNG screenshot of the live desktop
# as artifacts. Manual trigger; no image is built or pushed here.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to probe'
        required: false
        default: 'ghcr.io/junkerderprovinz/jdownloader:v3-preview'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Boot the container (jd-highlighter theme)
        run: |
          IMG="${{ github.event.inputs.image || 'ghcr.io/junkerderprovinz/jdownloader:jd-highlighter-preview' }}"
          docker pull "$IMG"                       # force a fresh pull (GHCR CDN can serve stale)
          echo "digest: $(docker inspect --format '{{index .RepoDigests 0}}' "$IMG" 2>/dev/null)"
          echo "IMAGE theme.sh render_properties count: $(docker run --rm --entrypoint sh "$IMG" -c 'grep -c render_properties /usr/local/bin/jdownloader-theme.sh' 2>/dev/null) (expect 3 = new theme.sh)"
          docker run -d --name jd -e JD_DEBUG_GEO=1 \
            -e JD_THEME=jd-highlighter -e JD_ACCENT="#ffee00" \
            -p 3000:3000 -p 3001:3001 "$IMG"

      - name: Wait for the JD GUI (READY banner, up to 15 min)
        run: |
          set -uo pipefail
          ready=""
          for i in $(seq 1 90); do
            if docker logs jd 2>&1 | grep -q "IS READY"; then
              echo "READY after ~$((i*10))s"; ready=1; break
            fi
            if [ -z "$(docker ps -q --filter name=jd)" ]; then
              echo "container exited early — logs:"; docker logs jd || true; exit 1
            fi
            sleep 10
          done
          [ -n "$ready" ] || { echo "no READY banner within 15 min — continuing anyway (GEO lines may still exist)"; }

      - name: Let the GUI settle, then collect the agent log
        run: |
          sleep 45
          mkdir -p out
          docker logs jd > out/full.log 2>&1 || true
          grep "jd-dialog-agent" out/full.log | tail -120 > out/agent-tail.log || true
          echo "=== last GEO lines ==="
          grep "GEO" out/agent-tail.log | tail -10 || echo "(no GEO lines found)"

      - name: FlatLaf install forensics
        run: |
          echo "=== libs/laf ==="
          docker exec jd sh -c 'ls -la /config/JDownloader/libs/laf/ 2>/dev/null' || echo "(no libs/laf)"
          echo "=== flatlaf.jar zip validity + FlatDarkLaf class ==="
          docker exec jd python3 -c "import zipfile; z=zipfile.ZipFile('/config/JDownloader/libs/laf/flatlaf.jar'); z.getinfo('com/formdev/flatlaf/FlatDarkLaf.class'); print('VALID zip, FlatDarkLaf.class present, testzip:', z.testzip())" \
            || echo "INVALID or missing flatlaf.jar"
          echo "=== extension registries ==="
          docker exec jd sh -c 'for f in /config/JDownloader/update/versioninfo/JD/extensions.*.json; do echo "--- $f"; cat "$f" 2>/dev/null; echo; done' || true
          echo "=== LAF classnotfound occurrences ==="
          grep -c "ClassNotFoundException: com.formdev.flatlaf" out/full.log || echo 0
          echo "=== heal lines ==="
          grep -E "INVALID flatlaf|deregistered|requested flatlaf" out/full.log || echo "(none)"

      - name: Screenshot the live desktop (main + tab-hover + settings + menu)
        run: |
          set -uo pipefail
          docker exec -u root jd bash -c 'apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq x11-apps imagemagick xdotool >/dev/null 2>&1' || true
          DISP=$(docker exec jd sh -c 'ls /tmp/.X11-unix 2>/dev/null | head -1 | sed "s/^X/:/"'); DISP="${DISP:-:1}"
          echo "X display: $DISP"; docker exec -u root -e DISPLAY="$DISP" jd sh -c 'xdotool getdisplaygeometry' || true
          shot() { docker exec -u root jd sh -c "xwd -root -display $DISP -silent | convert xwd:- png:-" > "out/$1.png" 2>/dev/null && echo "  shot $1 ($(wc -c < out/$1.png) bytes)"; }
          xd() { docker exec -u root -e DISPLAY="$DISP" jd xdotool "$@" 2>/dev/null || true; }
          WIN=$(docker exec -u root -e DISPLAY="$DISP" jd sh -c 'xdotool search --name JDownloader 2>/dev/null | tail -1' || true)
          [ -n "$WIN" ] && xd windowactivate "$WIN"; sleep 3
          shot 01-main
          xd mousemove 250 95;  sleep 1; shot 02-tab-hover      # hover the LinkGrabber tab (accent hover)
          xd key ctrl+p;        sleep 6; shot 03-settings        # open Settings (cards/sidebar/fields/scrollbar)
          xd mousemove 935 265; sleep 1; shot 08-btn-hover       # hover the Browse button -> blue frame? accent fill?
          xd mousemove 570 265; xd click 1; sleep 1; shot 09-field-focus  # focus the path field -> blue frame?
          xd mousemove 70 210;  sleep 1; shot 05-sidebar-hover   # hover a sidebar row (accent hover)
          # navigate to a page WITH an ExtTable (User Interface -> address-display table): verifies
          # borderless table + accent checkmarks (round 14) + fires the HL table-diag log line.
          xd mousemove 72 625; xd click 1; sleep 3; shot 06-table
          xd mousemove 520 540; sleep 1; shot 07-table-rowhover
          xd key F10; sleep 1; xd key Down; sleep 1; shot 04-menu; xd key Escape
          ls -la out/*.png 2>/dev/null || echo "no shots"

      - name: Re-collect agent log after navigation (HL round-14 diagnostics)
        run: |
          docker logs jd > out/full-after.log 2>&1 || true
          echo "=== HL diagnostics from docker logs (early agent lines only) ==="
          grep -aE "HL table-diag|HL sidebar-diag" out/full-after.log | tail -30 || echo "(none in docker logs)"
          echo "=== JD redirects System.out after startup -> tick logs land in JD's own log files ==="
          docker exec jd sh -c 'ls -R /config/JDownloader/logs 2>/dev/null | head -40' || true
          docker exec jd sh -c 'for f in $(find /config/JDownloader/logs -type f 2>/dev/null); do
              case "$f" in *.gz) zcat "$f" 2>/dev/null;; *) cat "$f" 2>/dev/null;; esac
            done' > out/jd-logs-all.txt 2>/dev/null || true
          echo "=== HL sidebar-diag / table-diag from JD logs ==="
          grep -aE "HL sidebar-diag|HL table-diag|settings sidebar row height" out/jd-logs-all.txt | tail -30 || echo "(none in JD logs)"
          echo "=== agent hl-diag file (reliable channel: /config/hl-diag.txt) ==="
          docker exec jd sh -c 'cat /config/hl-diag.txt 2>/dev/null' | tee out/hl-diag.txt || echo "(no hl-diag.txt)"
          echo "=== round 18: discover the downloads-table column config (keys for savetofolder/comment/progress) ==="
          docker exec jd sh -c 'ls -1 /config/JDownloader/cfg/ 2>/dev/null | grep -iE "table|download"' || true
          docker exec jd sh -c 'for f in $(grep -rliE "colwidth|columns|visible|colVisible|savetofolder" /config/JDownloader/cfg/ 2>/dev/null | grep -iE "download|table"); do echo "==== $f ===="; cat "$f"; echo; done' > out/coldump.txt 2>/dev/null || true
          echo "--- coldump (first 4k) ---"; head -c 4000 out/coldump.txt 2>/dev/null || echo "(empty)"

      - name: Icon-set inventory (mono coverage)
        run: |
          echo "=== mono recolour log ==="
          docker logs jd 2>&1 | grep -a "mono icons:" | tail -2 || echo "(no mono log — icons not mono'd!)"
          echo "=== themes/flat file types (svg vs png etc.) ==="
          docker exec jd sh -c 'find /config/JDownloader/themes/flat -type f 2>/dev/null | sed "s/.*\.//" | sort | uniq -c' || true
          echo "=== active iconsetid + mono dir present? ==="
          docker exec jd sh -c 'ls -d /config/JDownloader/themes/my-flat-mono-* 2>/dev/null; grep -aoE "\"iconsetid\":[^,]*" /config/JDownloader/cfg/laf/*.json 2>/dev/null | head -1' || true
          echo "=== config-sidebar-ish icon files (svg or png?) ==="
          docker exec jd sh -c 'find /config/JDownloader/themes/flat -type f 2>/dev/null | grep -iE "setting|reconnect|account|plugin|captcha|general|advanced|notif|premium|myjd" | head -25' || true
          echo "=== raw colour format of a still-colourful sidebar icon (mono set copy) ==="
          docker exec jd sh -c 'head -c 1400 /config/JDownloader/themes/my-flat-mono-light/org/jdownloader/images/reconnect.svg 2>/dev/null' || true
          echo "--- and settings.svg ---"
          docker exec jd sh -c 'grep -aoE "fill[:=][^;\"> ]{0,20}|rgb\([^)]*\)|stop-color[:=][^;\"> ]{0,20}|url\(#[^)]*\)" /config/JDownloader/themes/my-flat-mono-light/org/jdownloader/images/settings.svg 2>/dev/null | sort | uniq -c | head' || true
          echo "=== round 25: is the MONO reconnect.svg actually mono now (stroke recoloured)? ==="
          docker exec jd sh -c 'grep -aoE "stroke=\"[^\"]*\"|fill=\"[^\"]*\"|fill:#[0-9a-fA-F]*|stroke:#[0-9a-fA-F]*" /config/JDownloader/themes/my-flat-mono-light/org/jdownloader/images/reconnect.svg 2>/dev/null | sort | uniq -c' || true
          echo "=== how does JD pick the iconset? which cfg files mention iconset/mono/flat ==="
          docker exec jd sh -c 'grep -rlaiE "iconset|my-flat-mono" /config/JDownloader/cfg/ 2>/dev/null | head' || true
          docker exec jd sh -c 'grep -aohE "\"[a-zA-Z]*[Ii]conset[a-zA-Z]*\"[^,}]{0,40}|my-flat-mono[a-z-]*" /config/JDownloader/cfg/*.json /config/JDownloader/cfg/laf/*.json 2>/dev/null | sort -u | head' || true
          echo "=== does JD render from the flat set or the mono set? (which dir was read most recently) ==="
          docker exec jd sh -c 'ls -la --time-style=+%H:%M:%S /config/JDownloader/themes/flat/org/jdownloader/images/reconnect.svg /config/JDownloader/themes/my-flat-mono-light/org/jdownloader/images/reconnect.svg 2>/dev/null' || true
          echo "=== extract the top-level chrome icon SVGs (for the user to view/redesign) ==="
          docker exec jd sh -c 'cd /config/JDownloader/themes/flat/org/jdownloader/images 2>/dev/null && tar cf - --exclude="*/logo/*" $(ls *.svg 2>/dev/null | grep -v "\.icons8")' > out/jd-chrome-icons.tar 2>/dev/null || true
          echo "  tar bytes: $(wc -c < out/jd-chrome-icons.tar 2>/dev/null)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: geometry-probe
          path: out/
          if-no-files-found: warn
