name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          # DL3008 = apt version pinning – deliberately skipped
          # DL3009 = clean apt lists – cleaned once after final layer
          ignore: DL3008,DL3009
          failure-threshold: warning

  shellcheck:
    name: ShellCheck (init scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # No --shell override: shebangs are honored (autostart is /bin/sh, the
          # with-contenv scripts carry a `# shellcheck shell=bash` directive).
          find rootfs -type f \( \
              -name '*.sh' \
              -o -path '*/cont-init.d/*' \
              -o -path '*/defaults/autostart' \
              -o -path '*/s6-rc.d/*/run' \
              -o -path '*/s6-rc.d/*/finish' \
            \) -print0 | xargs -0 shellcheck --severity=warning

  xml-validate:
    name: XML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate XML files
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          for f in $(find . -name '*.xml' -not -path './.git/*'); do
            echo "Checking $f"
            xmllint --noout "$f"
          done

  pyflakes:
    name: Pyflakes (Python scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run pyflakes
        run: |
          pip install --quiet pyflakes
          find rootfs -name '*.py' -print0 | xargs -0 python3 -m pyflakes
