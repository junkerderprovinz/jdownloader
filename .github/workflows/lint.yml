name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # DL3008: apt version pinning, not wanted here
          # DL3009: apt lists, which are cleaned once after the final layer
          ignore: DL3008,DL3009
          failure-threshold: warning

  screen-size-tests:
    name: Screen size behaviour
    runs-on: ubuntu-latest
    # The tests only run a shell script; a hang must not sit in the queue for
    # the 6 h job default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run behaviour tests
        # Which screen size wins between the template's preset dropdown and its
        # free field, and what happens to a malformed one.
        run: bash tests/test-selkies-resolution.sh

  shellcheck:
    name: ShellCheck (init scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # No --shell override: shebangs are honored (autostart is /bin/sh, the
          # with-contenv scripts carry a `# shellcheck shell=bash` directive).
          find rootfs -type f \( \
              -name '*.sh' \
              -o -path '*/cont-init.d/*' \
              -o -path '*/defaults/autostart' \
              -o -path '*/s6-rc.d/*/run' \
              -o -path '*/s6-rc.d/*/finish' \
            \) -print0 | xargs -0 shellcheck --severity=warning

  xml-validate:
    name: XML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate XML files
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          for f in $(find . -name '*.xml' -not -path './.git/*'); do
            echo "Checking $f"
            xmllint --noout "$f"
          done

  pyflakes:
    name: Pyflakes (Python scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run pyflakes
        run: |
          pip install --quiet pyflakes
          find rootfs -name '*.py' -print0 | xargs -0 python3 -m pyflakes
