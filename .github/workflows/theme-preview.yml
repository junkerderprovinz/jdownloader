name: Preview Image

# Builds THIS branch's image, boots it with JD_THEME=jd-highlighter to prove the
# theme applies and the JVM stays up, then pushes it to GHCR under a SEPARATE
# preview tag (:jd-highlighter-preview) so it can be run as a parallel test
# container. It never touches :latest. Runs when this file or the theme changes.

on:
  push:
    branches: [ feat/jd-highlighter ]
    paths:
      - '.github/workflows/theme-preview.yml'
      - 'rootfs/opt/JDownloader/flatlaf-defaults/highlighter.properties.tmpl'
      - 'rootfs/usr/local/bin/jdownloader-theme.sh'
      - 'rootfs/etc/cont-init.d/10-jdownloader-setup'
      - 'rootfs/defaults/autostart'
      - 'agent/**'

permissions:
  contents: read
  packages: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMG: ghcr.io/junkerderprovinz/jdownloader:jd-highlighter-preview
    steps:
      - uses: actions/checkout@v4

      - name: Build the branch image (amd64)
        run: DOCKER_BUILDKIT=1 docker build -t jd:preview .

      - name: Boot with the jd-highlighter theme (READY + no crash gate)
        run: |
          set -uo pipefail
          docker run -d --name jd \
            -e JD_THEME=jd-highlighter -e JD_ACCENT="#ffee00" -e JD_ICONS=mono -e JD_DEBUG_GEO=1 \
            -p 3000:3000 -p 3001:3001 jd:preview
          for i in $(seq 1 90); do
            docker logs jd 2>&1 | grep -q "IS READY" && { echo "READY after ~$((i*10))s"; break; }
            [ -z "$(docker ps -q --filter name=jd)" ] && { echo "exited early:"; docker logs jd || true; exit 1; }
            sleep 10
          done
          sleep 20
          docker logs jd > full.log 2>&1 || true
          grep -E "wrote accented FlatLaf defaults|registered custom defaults source|mono icons: recoloured|folderwatch enabled" full.log | tail -8 || echo "(no theme signals)"
          # the mono-icon generator must have run and produced a non-empty set
          grep -qE "mono icons: recoloured [1-9][0-9]* svgs" full.log || { echo "::error::mono icon generation produced nothing"; exit 1; }
          docker exec jd sh -c 'ls /config/JDownloader/themes/my-flat-mono/org/jdownloader/images >/dev/null 2>&1' || { echo "::error::my-flat-mono iconset missing"; exit 1; }
          if grep -E "UnsupportedClassVersionError|processing of -javaagent failed|FATAL ERROR in native method|agent load/premain call failed" full.log; then
            echo "::error::agent/JVM crash signature — not pushing"; exit 1
          fi
          echo "clean — safe to publish the preview tag"

      - name: Folderwatch deep diagnostics (NON-GATING — module installs, why no scan?)
        run: |
          set -uo pipefail
          echo "=== module + installed list ==="
          docker exec jd sh -c 'ls -la /config/JDownloader/extensions/; echo installed:; cat /config/JDownloader/update/versioninfo/JD/extensions.installed.json 2>/dev/null'
          echo "=== discovery cache (folderwatch present? enabled?) ==="
          docker exec jd sh -c 'cat /config/JDownloader/tmp/extensioncache/extensionInfos.json 2>/dev/null | tr "{}," "\n\n\n" | grep -iE "classname|enabled|jarpath|folderwatch" | head -60' || echo "(none)"
          echo "=== ExtensionController / FolderWatch init+start log lines ==="
          docker logs jd 2>&1 | grep -iE "ExtensionController|OptionalExtension|FolderWatch|folderwatch|LazyExtension|Loaded Extension|StartExtension|scheduler" | tail -60 || echo "(none)"
          echo "=== BOOT #1: drop crawljob AS ABC (real Selkies upload owner) ==="
          docker exec -u abc jd sh -c 'mkdir -p /config/Desktop && printf "text=https://example.org/fw-a.bin\npackageName=fw-a\n" > /config/Desktop/fw-a.crawljob'
          sleep 35
          docker exec jd sh -c 'ls -la /config/Desktop /config/Desktop/added 2>/dev/null'
          docker logs jd 2>&1 | grep -iE "folderwatch|crawljob|added|LinkColl" | tail -15 || true
          echo "=== RESTART TEST: does a freshly-installed extension need a 2nd boot? ==="
          docker restart jd >/dev/null 2>&1 || true
          for i in $(seq 1 36); do docker logs jd 2>&1 | grep -q "IS READY" && { echo "ready after restart ~$((i*5))s"; break; }; sleep 5; done
          sleep 15
          docker exec -u abc jd sh -c 'printf "text=https://example.org/fw-b.bin\npackageName=fw-b\n" > /config/Desktop/fw-b.crawljob' || true
          sleep 35
          echo "--- BOOT #2 (after restart): ---"
          docker exec jd sh -c 'ls -la /config/Desktop /config/Desktop/added 2>/dev/null' || true
          docker logs jd 2>&1 | grep -iE "folderwatch|crawljob|added" | tail -15 || true
          echo "(diagnostics only — never fails the build)"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push the preview tag (never :latest)
        run: |
          docker tag jd:preview "$IMG"
          docker push "$IMG"
          echo "published $IMG"
