name: Preview Image

# Builds THIS branch's image, boots it with JD_THEME=jd-highlighter to prove the
# theme applies and the JVM stays up, then pushes it to GHCR under a SEPARATE
# preview tag (:jd-highlighter-preview) so it can be run as a parallel test
# container. It never touches :latest. Runs when this file or the theme changes.

on:
  push:
    branches: [ feat/jd-highlighter ]
    paths:
      - '.github/workflows/theme-preview.yml'
      - 'rootfs/opt/JDownloader/flatlaf-defaults/highlighter.properties.tmpl'
      - 'rootfs/usr/local/bin/jdownloader-theme.sh'
      - 'rootfs/etc/cont-init.d/10-jdownloader-setup'
      - 'rootfs/defaults/autostart'
      - 'agent/**'

permissions:
  contents: read
  packages: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMG: ghcr.io/junkerderprovinz/jdownloader:jd-highlighter-preview
    steps:
      - uses: actions/checkout@v4

      - name: Build the branch image (amd64)
        run: DOCKER_BUILDKIT=1 docker build -t jd:preview .

      - name: Boot with the jd-highlighter theme (READY + no crash gate)
        run: |
          set -uo pipefail
          docker run -d --name jd \
            -e JD_THEME=jd-highlighter -e JD_ACCENT="#ffee00" -e JD_ICONS=mono -e JD_DEBUG_GEO=1 \
            -p 3000:3000 -p 3001:3001 jd:preview
          for i in $(seq 1 90); do
            docker logs jd 2>&1 | grep -q "IS READY" && { echo "READY after ~$((i*10))s"; break; }
            [ -z "$(docker ps -q --filter name=jd)" ] && { echo "exited early:"; docker logs jd || true; exit 1; }
            sleep 10
          done
          sleep 20
          docker logs jd > full.log 2>&1 || true
          grep -E "wrote accented FlatLaf defaults|registered custom defaults source|mono icons: recoloured|folderwatch enabled" full.log | tail -8 || echo "(no theme signals)"
          # the mono-icon generator must have run and produced a non-empty set
          grep -qE "mono icons: recoloured [1-9][0-9]* svgs" full.log || { echo "::error::mono icon generation produced nothing"; exit 1; }
          docker exec jd sh -c 'ls /config/JDownloader/themes/my-flat-mono/org/jdownloader/images >/dev/null 2>&1' || { echo "::error::my-flat-mono iconset missing"; exit 1; }
          if grep -E "UnsupportedClassVersionError|processing of -javaagent failed|FATAL ERROR in native method|agent load/premain call failed" full.log; then
            echo "::error::agent/JVM crash signature — not pushing"; exit 1
          fi
          echo "clean — safe to publish the preview tag"

      - name: Folderwatch diagnostics (NON-GATING while the extension-load is cracked)
        run: |
          set -uo pipefail
          FW=/config/JDownloader/cfg/org.jdownloader.extensions.folderwatchV2.FolderWatchExtension.json
          echo "=== 1) seeded config (expect enabled:true, freshinstall:false) ==="
          docker exec jd cat "$FW" 2>/dev/null || echo "(missing)"
          echo "=== 2) extension DISCOVERY cache — does it list folderwatchV2? (post-boot; GUI scan rewrites it) ==="
          docker exec jd sh -c 'ls -la /config/JDownloader/tmp/extensioncache/ 2>/dev/null; echo "---"; cat /config/JDownloader/tmp/extensioncache/extensionInfos.json 2>/dev/null | tr "{},[]" "\n\n\n\n\n" | grep -iE "classname|name.*:|folderwatch" | head -60' || echo "(no cache)"
          echo "=== 3) folderwatch EXTENSION artifacts on disk (is the module provisioned at all?) ==="
          docker exec jd sh -c 'find /config/JDownloader -iname "*folderwatch*" 2>/dev/null | head -40; echo "--- extensions dir ---"; ls -la /config/JDownloader/extensions 2>/dev/null; ls -la /config/JDownloader/libs 2>/dev/null | head' || true
          echo "=== 4) extension controller / load log lines ==="
          docker logs jd 2>&1 | grep -iE "Loaded Extension|@ExtensionController|ExtensionController|installExtension|LazyExtension|folderwatch|FolderWatch" | tail -50 || echo "(none)"
          echo "=== 5) crawljob probe (NON-GATING — just reports) ==="
          docker exec jd sh -c 'mkdir -p /config/Desktop && printf "text=https://example.org/fw-citest.bin\npackageName=fw-citest\nenabled=TRUE\nautoStart=FALSE\n" > /config/Desktop/fw-citest.crawljob'
          ok=0
          for i in $(seq 1 8); do
            docker exec jd sh -c 'ls /config/Desktop/added/*.crawljob >/dev/null 2>&1' && { ok=1; break; }
            sleep 5
          done
          if [ "$ok" = 1 ]; then
            echo "folderwatch WORKS — crawljob moved to added/"
          else
            echo "::warning::folderwatch still not importing — see diagnostics above. Theme + agent fixes still publish; folderwatch is being cracked separately."
            docker exec jd sh -c 'ls -la /config/Desktop /config/Desktop/added 2>/dev/null' || true
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push the preview tag (never :latest)
        run: |
          docker tag jd:preview "$IMG"
          docker push "$IMG"
          echo "published $IMG"
