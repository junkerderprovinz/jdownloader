# picom config for JD Highlighter: anti-aliased rounded corners on dialog windows.
#
# Java's Window.setShape needs per-pixel transparency the GPU-less Xvfb display does not
# offer, and X-SHAPE gives hard 1-bit corners that look broken in the WebRTC stream, so a
# compositor is the only way to round real top-level windows here. Selkies encodes H.264
# in software on the same CPU, so everything expensive stays off.

backend = "xrender";
vsync = false;
use-damage = true;

# A pixel radius, matching the theme's 8px (FlatLaf's arc 16 is a diameter).
corner-radius = 8;
round-borders = 1;
detect-rounded-corners = true;
# The main frame fills the screen, so only dialogs need rounding. A JD dialog without
# _NET_WM_WINDOW_TYPE_DIALOG would need a WM_CLASS or name match here instead.
rounded-corners-exclude = [
  "window_type != 'dialog'"
];

shadow = false;
fading = false;
blur-method = "none";
