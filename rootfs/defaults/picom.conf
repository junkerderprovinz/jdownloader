# JD Highlighter — minimal picom compositor config.
#
# Purpose: give the pop-up DIALOG windows anti-aliased rounded corners (the theme wants them
# rounded like the tabs). This is the only way to round real top-level windows in the container:
# Java's Window.setShape needs per-pixel transparency the GPU-less Xvfb display does not expose,
# and the X-SHAPE fallback only yields hard 1-bit corners that read as broken over the WebRTC
# video stream. A compositor rounds with real anti-aliasing.
#
# Cost control: this box has NO GPU (software Xvfb) and Selkies runs a software H.264 encoder on
# the same CPU, so EVERYTHING expensive is off — xrender backend, damage-only recompositing, no
# shadow/fade/blur — to stay out of the encoder's way.

backend = "xrender";
vsync = false;
use-damage = true;          # only recomposite damaged regions -> minimal CPU alongside the encoder

# Rounded corners
corner-radius = 12;         # matches the tab/card arc
round-borders = 1;
detect-rounded-corners = true;
# Round ONLY dialog windows. The main JD frame fills the screen (no visible corners), and other
# window types stay square. If a JD dialog turns out not to carry _NET_WM_WINDOW_TYPE_DIALOG,
# switch this to a WM_CLASS / window-name match instead.
rounded-corners-exclude = [
  "window_type != 'dialog'"
];

# Everything expensive OFF (protect the software video encoder)
shadow = false;
fading = false;
blur-method = "none";
