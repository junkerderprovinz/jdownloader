# jdp-carbon-dark (v3 mechanism) — complete #161616 monochrome dark.
#
# This file is registered at runtime via FlatLaf.registerCustomDefaultsSource(File)
# by the jd-dialog-agent. It replaces the old approach of patching these lines INTO
# JD's installed flatlaf.jar (+ forging the SHA-256 in flatlaf.dep.json): the jar now
# stays STOCK, JD's integrity check is always satisfied, and a JD self-update can no
# longer reset the chrome theme — this file is ours, not JD's.
#
# Content = the proven "v6" override block (unchanged):
# The progress fill is @accentSliderColor = if(@accentColor, @accentColor,
# @accentBase2Color), and @accentBase2Color = lighten(... @accentBaseColor ...).
# FlatLaf recomputes @accentColor at runtime (systemColor(accent) = null on Linux),
# so only the MASTER @accentBaseColor cascades: @accentBaseColor -> @accentBase2Color
# -> @accentSliderColor -> ProgressBar fill. A LIGHT @accentBaseColor therefore gives
# a light bar; the % text is inverted dark over the fill via
# ProgressBar.selectionForeground and stays light over the dark track via
# selectionBackground.
@background = #161616
@foreground = #f4f4f4
@componentBackground = #1e1e1e
@disabledForeground = #6f6f6f
@accentBaseColor = #c6c6c6
@selectionBackground = #525252
@selectionForeground = #f4f4f4
ProgressBar.background = #262626
ProgressBar.selectionForeground = #161616
ProgressBar.selectionBackground = #f4f4f4

# Checkbox / radio button visibility. FlatLaf's stock unchecked border is tuned for
# its lighter default dark background (#3c3f41); on our much darker #161616 it nearly
# vanishes (forum report: "unchecked checkboxes are barely visible"). Pin the icon
# colours to the Carbon greyscale so the EMPTY box reads clearly, while the checked
# state keeps the light @accentBaseColor fill with a dark checkmark.
CheckBox.icon.borderColor = #8d8d8d
CheckBox.icon.disabledBorderColor = #525252
CheckBox.icon.focusedBorderColor = #a8a8a8
CheckBox.icon.hoverBorderColor = #a8a8a8
CheckBox.icon.background = #262626
CheckBox.icon.disabledBackground = #1e1e1e
CheckBox.icon.selectedBorderColor = #c6c6c6
CheckBox.icon.selectedBackground = #c6c6c6
CheckBox.icon.checkmarkColor = #161616
CheckBox.icon.disabledCheckmarkColor = #6f6f6f
RadioButton.icon.borderColor = #8d8d8d
RadioButton.icon.disabledBorderColor = #525252
RadioButton.icon.focusedBorderColor = #a8a8a8
RadioButton.icon.hoverBorderColor = #a8a8a8
RadioButton.icon.background = #262626
RadioButton.icon.disabledBackground = #1e1e1e
RadioButton.icon.selectedBorderColor = #c6c6c6
RadioButton.icon.selectedBackground = #c6c6c6
RadioButton.icon.centerColor = #161616
RadioButton.icon.disabledCenterColor = #6f6f6f
