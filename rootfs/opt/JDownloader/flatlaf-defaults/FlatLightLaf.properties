# jdp-plain-light (v3 mechanism) — matching FlatDarkLaf.properties.
#
# Registered at runtime via FlatLaf.registerCustomDefaultsSource(File) by the
# jd-dialog-agent (same directory, same mechanism as FlatDarkLaf.properties —
# FlatLaf auto-discovers "FlatLightLaf.properties" for the FlatLightLaf class,
# see https://www.formdev.com/flatlaf/how-to-customize/#application_properties_files).
#
# jdownloader#16 (milfer322): hovering a download-table COLUMN HEADER (e.g.
# "Name") paints the whole cell solid black instead of a normal light hover
# highlight. Stock FlatLaf's own formula (TableHeader.hoverBackground =
# darken($TableHeader.background,5%,derived), light @componentBackground ~=
# #f9f9f9) would only barely darken, never go black — so this key is pinned
# explicitly rather than left to derive.
TableHeader.hoverBackground = #e8e8e8
TableHeader.hoverForeground = #000000
TableHeader.pressedBackground = #d8d8d8
TableHeader.pressedForeground = #000000
